# ── Phase 2 run-3 · Classifier v2 training config ──────────────────────────────
# Run:  python train_v2.py --config configs/classifier_v2.yaml
#       python train_v2.py --config configs/classifier_v2.yaml --epochs 25  # CLI overrides

model: classifier
data: /home/aviramom/projects/15-puzzle-solver/phase1_data_generation/data/full/dataset_000.bin

# Training — 20 epochs (run 2 showed no plateau at ep 14; +6 epochs expected to reach MAE ≈ 0.97)
epochs: 20
batch_size: 1024
lr: 0.001
seed: 42
num_workers: 4

# Run-3 feature engineering
residual_target: true    # train on r(s) = h*(s) − MD_sum instead of h*(s) directly
input_dim: 272           # 256 one-hot + 16 per-cell Manhattan distances

# Checkpointing (separate from run-2 weights)
out: checkpoints_v2
snapshot_every: 5

# Results (plots + test_metrics.json)
results: results/run3

# CDF quantile threshold for val/test metrics during training (None = argmax).
# Sweep post-training with evaluate_thresholds_v2.py to find the ≥99% admissibility point.
cdf_threshold: 0.5

# tau is ignored for the classifier
tau: 0.3
